name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check workbench-aligned tree
        run: |
          test -s index.html
          test -s game.js
          test -s data/words.js
          test -s assets/atlas/dirt.png
          test -s assets/sky/plains.png
          test -s assets/ui/sword.png
          test -s shared/workbench-bridge.js
          test -s shared/game-sfx.js
          test -s preschool-english-vocab.js
          test -s child-courses.js
          test -s vocab/core-english-2026.08.15/catalog.json
          grep -q "./vocab/core-english-2026.08.15" data/words.js
          grep -q "./shared/workbench-bridge.js" index.html
          grep -q 'id="touch-pad"' index.html

      - name: Assemble Capacitor webDir
        run: npm run android:prepare

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Generate Android project
        run: npm run android:init

      - name: Sync web assets
        run: npx cap sync android && node scripts/patch-android.mjs

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "$GITHUB_WORKSPACE/android/release.jks"
            test -s "$GITHUB_WORKSPACE/android/release.jks"
            echo "has_keystore=true" >> "$GITHUB_ENV"
          else
            echo "has_keystore=false" >> "$GITHUB_ENV"
          fi

      - name: Build signed release APK
        if: env.has_keystore == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Build debug APK
        if: env.has_keystore != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verify and name APK
        run: |
          VER=$(tr -d '\r\n' < VERSION)
          echo "APP_VER=$VER" >> "$GITHUB_ENV"
          if [ -s android/app/build/outputs/apk/release/app-release.apk ]; then
            SRC=android/app/build/outputs/apk/release/app-release.apk
          else
            test -s android/app/build/outputs/apk/debug/app-debug.apk
            SRC=android/app/build/outputs/apk/debug/app-debug.apk
          fi
          cp "$SRC" "blocklegend-${VER}.apk"
          test -s "blocklegend-${VER}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: blocklegend-apk-${{ github.ref_name }}
          path: blocklegend-*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="$APP_VER"
          TAG="v$VER"
          NOTES=$(node scripts/release-notes.mjs "$VER")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "方块传奇 $VER" --notes "$NOTES" --latest
            gh release upload "$TAG" "blocklegend-${VER}.apk" --clobber
          else
            gh release create "$TAG" "blocklegend-${VER}.apk" --title "方块传奇 $VER" --notes "$NOTES" --latest
          fi
