            { id: 'wood_axe', zh: '木斧', group: 'tool', make: function () { return window.BlockLegendTools3d.createWoodAxe(THREE); } },
            { id: 'iron_axe', zh: '铁斧', group: 'tool', make: function () { return window.BlockLegendTools3d.createIronAxe(THREE); } },
            { id: 'diamond_axe', zh: '钻石斧', group: 'tool', make: function () { return window.BlockLegendTools3d.createDiamondAxe(THREE); } },

        const shared = new THREE.WebGLRenderer({ antialias: false });
        shared.setPixelRatio(1);
        shared.setSize(220, 180, false);
        const cards = [];
        ROSTER.forEach(function (row) {
            const host = document.getElementById('g-' + row.group);
            const card = document.createElement('div');
            card.className = 'card';
            card.setAttribute('data-kind', row.id);
            const canvas = document.createElement('canvas');
            canvas.width = 220;
            canvas.height = 180;
            const title = document.createElement('b');
            title.textContent = row.zh;
            const sub = document.createElement('span');
            sub.textContent = row.id;
            card.appendChild(canvas);
            card.appendChild(title);
            card.appendChild(sub);
            host.appendChild(card);
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x7ec8f0);
            const camera = new THREE.PerspectiveCamera(42, 220 / 180, 0.1, 30);
            scene.add(new THREE.HemisphereLight(0xffffff, 0x667788, 0.9));
            const sun = new THREE.DirectionalLight(0xfff4d6, 0.5);
            sun.position.set(3, 6, 2);
            scene.add(sun);
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(8, 8), new THREE.MeshLambertMaterial({ color: 0x7a9a4a }));
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);
            const model = row.make();
            if (row.group === 'prop') model.position.y = 0.15;
            if (row.group === 'tool') model.position.y = 0.85;
            scene.add(model);
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const dist = Math.max(1.7, Math.max(size.x, size.y, size.z) * 1.9);
            let yaw = 0.7;
            card.addEventListener('pointermove', function (e) {
                if (e.buttons) yaw += e.movementX * 0.01;
            });
            card.addEventListener('dblclick', function () {
                location.href = './preview-mobs.html?v=20260816-bl-mobs3';
            });
            cards.push({
                scene: scene,
                camera: camera,
                canvas: canvas,
                model: model,
                dist: dist,
                lookY: Math.max(0.35, center.y),
                yaw: function () { return yaw; }
            });
        });
        ['pig', 'cow', 'sheep', 'chicken', 'wolf', 'villager', 'golem'].forEach(function (id) {
            const host = document.getElementById('g-fourview');
            const card = document.createElement('div');
            card.className = 'card';
            const img = document.createElement('img');
            img.src = './generated/blocklegend-roster/four-view/' + id + '-4view.png?v=20260817-bl-gpt4v';
            img.alt = id + ' four-view';
            img.style.width = '100%';
            img.style.display = 'block';
            img.style.background = '#14171c';
            const title = document.createElement('b');
            title.textContent = id + ' 四视图';
            card.appendChild(img);
            card.appendChild(title);
            host.appendChild(card);
        });
        const clock = new THREE.Clock();
        function frame() {
            requestAnimationFrame(frame);
            const t = clock.getElapsedTime();
            cards.forEach(function (c) {
                if (c.model.userData.tick) c.model.userData.tick(t);
                const yaw = c.yaw();
                c.camera.position.set(Math.cos(yaw) * c.dist, c.lookY + c.dist * 0.22, Math.sin(yaw) * c.dist);
                c.camera.lookAt(0, c.lookY, 0);
                shared.render(c.scene, c.camera);
                c.canvas.getContext('2d').drawImage(shared.domElement, 0, 0);
            });
        }
        frame();
    }());
