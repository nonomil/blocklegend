    <style>
        html, body { margin: 0; background: #14171c; color: #f4f0e6; font-family: sans-serif; }
        h1 { margin: 16px 20px 4px; font-size: 20px; }
        .sub { margin: 0 20px 12px; opacity: .75; font-size: 13px; }
        .tabs { display: flex; gap: 8px; padding: 0 20px 14px; flex-wrap: wrap; }
        .tab-btn { background: #1d222b; border: 1px solid #333d4d; color: #ccd; padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer; }
        .tab-btn:hover { background: #28303e; }
        .tab-btn.active { background: #2563eb; border-color: #3b82f6; color: #fff; font-weight: bold; }
        .row { display: flex; gap: 20px; padding: 0 20px 24px; align-items: flex-start; flex-wrap: nowrap; }
        .row.is-hidden { display: none; }
        .pane { background: #1d222b; border-radius: 10px; padding: 12px; }
        .pane b { display: block; margin-bottom: 8px; font-size: 14px; }
        .pane canvas, .pane img { display: block; width: 380px; height: 380px; image-rendering: pixelated; }
    </style>
</head>
<body>

    <script src="./assets/atlas4v/vindicator-atlas.js?v=20260819-bl-opt55"></script>
    <script src="./assets/atlas4v/guardian-atlas.js?v=20260819-bl-opt41"></script>
    <script src="./assets/atlas4v/elder_guardian-atlas.js?v=20260819-bl-opt51"></script>
    <script src="./assets/atlas4v/pufferfish-atlas.js?v=20260819-bl-opt3"></script>
    <script src="./assets/atlas4v/spore_bug-atlas.js?v=20260819-bl-opt50"></script>
    <script src="./assets/atlas4v/fire_spirit-atlas.js?v=20260819-bl-opt3"></script>
    <script src="./assets/atlas4v/sculk_worm-atlas.js?v=20260819-bl-opt49"></script>
    <script src="./assets/atlas4v/shadow_stalker-atlas.js?v=20260819-bl-opt42"></script>
    <script src="./assets/img2threejs/fourViewModel.js?v=20260821-box4"></script>
    <script>
    (function () {
        const THREE = window.THREE;
        const bust = '?t=' + Date.now();
        const MODELS = [
            { id: 'golem', zh: '铁傀儡', opts: { swingArms: true, texQuery: bust } },
            { id: 'villager', zh: '村民', opts: { swingArms: false, texQuery: bust } },
            { id: 'pig', zh: '猪', opts: { texQuery: bust } },
            { id: 'cow', zh: '牛', opts: { texQuery: bust } },
            { id: 'sheep', zh: '羊', opts: { texQuery: bust } },
            { id: 'chicken', zh: '鸡', opts: { texQuery: bust } },
            { id: 'wolf', zh: '狼', opts: { texQuery: bust } },
            { id: 'creeper', zh: '苦力怕', opts: { texQuery: bust } },
            { id: 'zombie', zh: '僵尸', opts: { texQuery: bust } },
            { id: 'skeleton', zh: '骷髅', opts: { texQuery: bust } },
            { id: 'spider', zh: '蜘蛛', opts: { texQuery: bust } },
            { id: 'enderman', zh: '末影人', opts: { texQuery: bust } },
            { id: 'witch', zh: '女巫', opts: { texQuery: bust } },
            { id: 'piglin', zh: '猪灵', opts: { texQuery: bust } },
            { id: 'slime', zh: '史莱姆', opts: { texQuery: bust } },
            { id: 'blaze', zh: '烈焰人', opts: { texQuery: bust } },
            { id: 'ghast', zh: '恶魂', opts: { texQuery: bust } },
            { id: 'warden', zh: '监守者', opts: { texQuery: bust } },
            { id: 'fox', zh: '狐狸', opts: { texQuery: bust } },
            { id: 'cube', zh: '方块兽', opts: { texQuery: bust } },
            { id: 'magma', zh: '岩浆怪', opts: { texQuery: bust } },
            { id: 'trader', zh: '流浪商人', opts: { swingArms: false, texQuery: bust } },
            { id: 'bee', zh: '蜜蜂', opts: { texQuery: bust } },
            { id: 'wither', zh: '凋灵', opts: { texQuery: bust } },
            { id: 'dragon', zh: '学园龙', opts: { texQuery: bust } },
            { id: 'storm', zh: '凋灵风暴', opts: { texQuery: bust } },
            { id: 'husk', zh: '尸壳', opts: { texQuery: bust } },
            { id: 'pillager', zh: '掠夺者', opts: { texQuery: bust } },
            { id: 'ravager', zh: '劫掠兽', opts: { texQuery: bust } },
            { id: 'phantom', zh: '幻翼', opts: { texQuery: bust } },
            { id: 'vex', zh: '恼鬼', opts: { texQuery: bust } },
            { id: 'drowned', zh: '溺尸', opts: { texQuery: bust } },
            { id: 'snowgolem', zh: '雪傀儡', opts: { texQuery: bust } },
            { id: 'vindicator', zh: '卫道士', opts: { texQuery: bust } },
            { id: 'guardian', zh: '守卫者', opts: { texQuery: bust } },
            { id: 'elder_guardian', zh: '远古守卫者', opts: { texQuery: bust } },
            { id: 'pufferfish', zh: '河豚', opts: { texQuery: bust } },
            { id: 'spore_bug', zh: '孢子虫', opts: { texQuery: bust } },
            { id: 'fire_spirit', zh: '火灵', opts: { texQuery: bust } },
            { id: 'sculk_worm', zh: '幽匿虫', opts: { texQuery: bust } },
            { id: 'shadow_stalker', zh: '影行者', opts: { texQuery: bust } }
        ];
        const VIEWS = [
            { name: 'front', dir: [0, 0, 1] },
            { name: 'right', dir: [1, 0, 0] },
            { name: 'back', dir: [0, 0, -1] },
            { name: 'left', dir: [-1, 0, 0] }
        ];
        const stage = document.getElementById('stage');
        const tabs = document.getElementById('tabs');
        const rows = [];

        const work = document.createElement('canvas');
        work.width = 1024;
        work.height = 1024;
        const renderer = new THREE.WebGLRenderer({ canvas: work, antialias: false, preserveDrawingBuffer: true });
        renderer.setSize(1024, 1024, false);
        renderer.setClearColor(0xc8c4bc);
        renderer.setScissorTest(true);

        function selectTab(targetId) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.id === targetId);
            });
            rows.forEach(({ id, row }) => {
                row.classList.toggle('is-hidden', targetId !== 'all' && id !== targetId);
            });
        }

        const allBtn = document.createElement('button');
        allBtn.className = 'tab-btn active';
        allBtn.dataset.id = 'all';
        allBtn.textContent = '全部角色 (' + MODELS.length + ')';
        allBtn.onclick = () => selectTab('all');
        tabs.appendChild(allBtn);

        MODELS.forEach(function (m) {
            const btn = document.createElement('button');
            btn.className = 'tab-btn';
            btn.dataset.id = m.id;
            btn.textContent = m.zh + ' (' + m.id + ')';
            btn.onclick = () => selectTab(m.id);
            tabs.appendChild(btn);

            const row = document.createElement('div');
            row.className = 'row';
            row.id = 'row-' + m.id;
            const paneA = document.createElement('div');
            paneA.className = 'pane';
            paneA.innerHTML = '<b>' + m.zh + ' · 模型渲染</b>';
            const shot = document.createElement('img');
            shot.id = 'render-' + m.id;
            shot.alt = m.id + ' model';
            paneA.appendChild(shot);
            const paneB = document.createElement('div');
            paneB.className = 'pane';
            paneB.innerHTML = '<b>' + m.zh + ' · 生图参考</b>';
            const img = document.createElement('img');
            img.src = './generated/blocklegend-roster/four-view/' + m.id + '-4view.png?v=20260821-box3';
            paneB.appendChild(img);
            row.appendChild(paneA);
            row.appendChild(paneB);
            stage.appendChild(row);
            rows.push({ id: m.id, row: row, shot: shot, model: m });
        });

        function firstMap(root) {
            let found = null;
            root.traverse(function (obj) {
                if (!found && obj.material && obj.material.map) { found = obj.material.map; }
            });
            return found;
        }

        function waitTexture(tex) {
            return new Promise(function (resolve) {
                if (!tex) { resolve(); return; }
                if (tex.image && tex.image.complete && tex.image.naturalWidth) { resolve(); return; }
                var n = 0;
                var id = setInterval(function () {
                    n += 1;
                    if ((tex.image && tex.image.complete && tex.image.naturalWidth) || n > 80) {
                        clearInterval(id);
                        resolve();
                    }
                }, 50);
            });
        }

        function paint(m) {
            const scene = new THREE.Scene();
            scene.add(new THREE.AmbientLight(0xffffff, 1.0));
            const model = window.BlockLegendFourView.build(THREE, m.id, Object.assign({ flat: true }, m.opts));
            if (!model) { return ''; }
            scene.add(model);
            const bbox = new THREE.Box3().setFromObject(model);
            const center = bbox.getCenter(new THREE.Vector3());
            const size = bbox.getSize(new THREE.Vector3());
            const half = Math.max(size.x, size.y, size.z) * 0.5 * 1.15;
            VIEWS.forEach(function (v, i) {
                const cam = new THREE.OrthographicCamera(-half, half, half, -half, 0.01, 100);
                cam.position.set(center.x + v.dir[0] * 10, center.y + v.dir[1] * 10, center.z + v.dir[2] * 10);
                cam.lookAt(center);
                const vx = (i % 2) * 512;
                const vy = i < 2 ? 512 : 0;
                renderer.setViewport(vx, vy, 512, 512);
                renderer.setScissor(vx, vy, 512, 512);
                renderer.render(scene, cam);
            });
            return work.toDataURL('image/png');
        }

        const start = (location.hash || '').replace('#', '');
        if (start && MODELS.some(m => m.id === start)) { selectTab(start); }

        (async function bake() {
            const ordered = start
                ? rows.slice().sort(function (a, b) { return a.id === start ? -1 : b.id === start ? 1 : 0; })
                : rows;
            for (const row of ordered) {
                const model = window.BlockLegendFourView.build(THREE, row.model.id, Object.assign({ flat: true }, row.model.opts));
                await waitTexture(firstMap(model));
                row.shot.src = paint(row.model);
            }
        }());
    }());
    </script>
